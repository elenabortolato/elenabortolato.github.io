<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bussola Politica Lampo</title>
  <meta name="description" content="Versione lampo della Bussola Politica Italiana: 12 domande, sì o no, sopra la fotocamera frontale.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111114;
      --text: #ffffff;
      --muted: rgba(255, 255, 255, .75);
      --panel: rgba(0, 0, 0, .45);
      --yes: #16a34a;
      --no: #dc2626;
      --accent: #fb923c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .stage {
      position: relative;
      height: 100dvh;
      max-width: 100vw;
      aspect-ratio: 9 / 16;
      max-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: radial-gradient(120% 80% at 50% 30%, #3b2a5a 0%, #141420 60%, #0b0b10 100%);
    }
    video {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .layer {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    .hidden { display: none !important; }

    .top { margin-top: 9%; text-align: center; }
    .progress { display: flex; gap: 5px; justify-content: center; margin-bottom: 14px; }
    .progress span { width: 18px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.3); }
    .progress span.done { background: var(--accent); }
    .bubble {
      background: var(--panel);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      border-radius: 22px;
      padding: 18px 20px;
      font-weight: 800;
      font-size: clamp(1.25rem, 5.6vw, 1.7rem);
      line-height: 1.25;
      text-shadow: 0 1px 2px rgba(0,0,0,.4);
    }
    .bubble small { display: block; font-size: .62em; font-weight: 700; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 6px; }

    .bottom { margin-top: auto; margin-bottom: 14%; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .choice {
      appearance: none; border: 0; cursor: pointer;
      font: 800 1.6rem Inter, sans-serif; color: #fff;
      padding: 22px 0; border-radius: 22px;
      box-shadow: 0 6px 18px rgba(0,0,0,.35);
      transition: transform .12s;
    }
    .choice:active { transform: scale(.95); }
    .choice.no { background: var(--no); }
    .choice.yes { background: var(--yes); }

    .start-btn, .ghost {
      appearance: none; border: 0; cursor: pointer;
      font: 800 1.2rem Inter, sans-serif;
      padding: 16px 26px; border-radius: 999px;
    }
    .start-btn { background: var(--accent); color: #111; }
    .ghost { background: rgba(255,255,255,.18); color: #fff; font-size: 1rem; padding: 12px 20px; }

    .center { margin: auto 0; text-align: center; display: grid; gap: 18px; justify-items: center; }
    .title { font-weight: 800; font-size: clamp(2rem, 9vw, 2.8rem); line-height: 1.05; text-shadow: 0 2px 8px rgba(0,0,0,.5); }
    .sub { color: var(--muted); font-weight: 600; max-width: 22em; }

    .result-card {
      margin: auto 0;
      background: var(--panel);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      border-radius: 26px;
      padding: 22px 20px;
      text-align: center;
    }
    .result-card .label { color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; }
    .party { font-weight: 800; font-size: clamp(2.2rem, 11vw, 3.2rem); line-height: 1.05; margin: 8px 0 4px; }
    .pct { font-weight: 700; color: var(--muted); margin-bottom: 18px; }
    .axis { text-align: left; margin-top: 12px; }
    .axis .names { display: flex; justify-content: space-between; font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
    .axis .track { position: relative; height: 8px; border-radius: 4px; background: rgba(255,255,255,.22); margin-top: 6px; }
    .axis .dot { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--accent); border: 3px solid #fff; }
    .actions { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
    .actions a { color: #fff; }
  </style>
</head>
<body>
<div class="stage" id="stage">
  <video id="cam" autoplay playsinline muted></video>

  <div class="layer" id="intro">
    <div class="center">
      <div class="title">Che partito sei?<br>12 domande, sì o no.</div>
      <div class="sub">Rispondi d'istinto. Attiva la fotocamera per registrare la tua reazione.</div>
      <button class="start-btn" id="start">Inizia</button>
    </div>
  </div>

  <div class="layer hidden" id="quiz">
    <div class="top">
      <div class="progress" id="progress"></div>
      <div class="bubble"><small id="topic"></small><span id="question"></span></div>
    </div>
    <div class="bottom">
      <button class="choice no" data-v="-1">NO</button>
      <button class="choice yes" data-v="1">SÌ</button>
    </div>
  </div>

  <div class="layer hidden" id="result">
    <div class="result-card">
      <div class="label">Il partito più vicino a te</div>
      <div class="party" id="party"></div>
      <div class="pct" id="affinity"></div>
      <div id="axes"></div>
      <div class="actions">
        <button class="ghost" id="again">Rifai</button>
        <a class="ghost" href="index.html">Test completo →</a>
      </div>
    </div>
  </div>
</div>

<script>
// Stesse coordinate della versione completa (index.html).
// x: Stato ↔ mercato, y: sovranismo ↔ europeismo, z: vecchia politica ↔ discontinuità
const PARTIES = [
  { name: "ORA!",                      x:  4.0, y:  8.0, z:  8.0, color: "#ea580c" },
  { name: "Partito Liberaldemocratico", x:  6.0, y:  7.0, z:  1.0, color: "#0ea5e9" },
  { name: "+Europa",                   x:  4.0, y:  9.0, z: -4.0, color: "#c026d3" },
  { name: "Azione",                    x:  3.5, y:  6.5, z: -3.0, color: "#3b82f6" },
  { name: "Italia Viva",               x:  2.5, y:  7.0, z: -5.0, color: "#db2777" },
  { name: "Forza Italia",              x:  4.0, y:  4.5, z: -7.0, color: "#2563eb" },
  { name: "Noi Moderati",              x:  2.0, y:  2.5, z: -7.0, color: "#0891b2" },
  { name: "Partito Democratico",       x: -3.0, y:  6.0, z: -6.0, color: "#dc2626" },
  { name: "Fratelli d'Italia",         x:  0.5, y: -3.5, z: -4.0, color: "#3b5bdb" },
  { name: "Lega",                      x:  0.5, y: -7.0, z: -6.0, color: "#16a34a" },
  { name: "Futuro Nazionale",          x:  1.0, y: -9.0, z:  2.0, color: "#a16207" },
  { name: "Movimento 5 Stelle",        x: -5.0, y: -3.0, z: -3.0, color: "#ca8a04" },
  { name: "Alleanza Verdi e Sinistra", x: -7.5, y:  2.5, z: -4.0, color: "#65a30d" },
];

// dir: +1 se rispondere "sì" sposta verso mercato / europeismo / discontinuità
const QUESTIONS = [
  { topic: "Pensioni", axis: "x", dir: 1,  text: "Le pensioni vanno calcolate sui contributi versati?" },
  { topic: "Superbonus", axis: "x", dir: 1,  text: "Il Superbonus è stato uno spreco di soldi pubblici?" },
  { topic: "Sanità", axis: "x", dir: -1, text: "Più soldi pubblici alla sanità?" },
  { topic: "Imprese", axis: "x", dir: -1, text: "Lo Stato deve salvare le grandi aziende in crisi, come l'ex Ilva?" },
  { topic: "Europa", axis: "y", dir: 1,  text: "Ci vuole una difesa comune europea?" },
  { topic: "Ucraina", axis: "y", dir: -1, text: "Basta inviare armi all'Ucraina?" },
  { topic: "Immigrazione", axis: "y", dir: -1, text: "Ridurre anche l'immigrazione regolare?" },
  { topic: "Palestina", axis: "y", dir: 1,  text: "L'Italia deve riconoscere lo Stato di Palestina?" },
  { topic: "Politica", axis: "z", dir: -1, text: "I partiti al governo da 20 anni sanno fare le riforme?" },
  { topic: "Giustizia", axis: "z", dir: 1,  text: "Ogni processo deve avere una durata massima fissata per legge?" },
  { topic: "Scuola", axis: "z", dir: 1,  text: "Stessa scuola per tutti fino a 16 anni?" },
  { topic: "ISEE", axis: "z", dir: -1, text: "L'ISEE basta per decidere chi riceve aiuti pubblici?" },
];

const AXES = [
  { key: "x", neg: "Stato", pos: "Mercato" },
  { key: "y", neg: "Sovranismo", pos: "Europeismo" },
  { key: "z", neg: "Vecchia politica", pos: "Discontinuità" },
];

const $ = id => document.getElementById(id);
let current = 0;
let answers = [];

function show(id) {
  ["intro", "quiz", "result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
}

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
    $("cam").srcObject = stream;
  } catch (e) {
    // senza fotocamera resta lo sfondo sfumato
    $("cam").classList.add("hidden");
  }
}

function renderQuestion() {
  const q = QUESTIONS[current];
  $("topic").textContent = q.topic;
  $("question").textContent = q.text;
  $("progress").innerHTML = QUESTIONS.map((_, i) => `<span class="${i < current ? "done" : ""}"></span>`).join("");
}

function position() {
  const sum = { x: 0, y: 0, z: 0 }, n = { x: 0, y: 0, z: 0 };
  QUESTIONS.forEach((q, i) => { sum[q.axis] += answers[i] * q.dir; n[q.axis]++; });
  const stretch = r => Math.sign(r) * Math.sqrt(Math.abs(r)) * 10;
  return { x: stretch(sum.x / n.x), y: stretch(sum.y / n.y), z: stretch(sum.z / n.z) };
}

function showResult() {
  const me = position();
  const maxD = Math.hypot(20, 20, 20);
  const ranked = PARTIES
    .map(p => ({ ...p, a: Math.round(100 * (1 - Math.hypot(p.x - me.x, p.y - me.y, p.z - me.z) / maxD)) }))
    .sort((a, b) => b.a - a.a);
  const top = ranked[0];
  $("party").textContent = top.name;
  $("party").style.color = top.color;
  $("affinity").textContent = `Affinità ${top.a}%`;
  $("axes").innerHTML = AXES.map(ax => `
    <div class="axis">
      <div class="names"><span>${ax.neg}</span><span>${ax.pos}</span></div>
      <div class="track"><div class="dot" style="left:${(me[ax.key] + 10) * 5}%"></div></div>
    </div>`).join("");
  show("result");
}

document.querySelectorAll(".choice").forEach(b => b.onclick = () => {
  answers[current] = +b.dataset.v;
  if (++current < QUESTIONS.length) renderQuestion();
  else showResult();
});

$("start").onclick = () => {
  startCamera();
  current = 0; answers = [];
  renderQuestion();
  show("quiz");
};
$("again").onclick = () => { current = 0; answers = []; renderQuestion(); show("quiz"); };
</script>
</body>
</html>
